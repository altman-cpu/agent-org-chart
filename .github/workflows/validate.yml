name: Validate app and payloads

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint, and simulate payloads
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Validate chart data
        run: npm run validate

      - name: Validate synthetic API payloads
        run: npm run validate:api

      - name: Validate the custom agent package
        run: npm run validate:agent

      - name: Smoke-test controlled stdin and stdout bridge
        run: npm run agent:stdio:smoke

      - name: Run bounded local payload simulation
        run: npm run simulate:api

      - name: Audit dependencies
        run: npm audit
